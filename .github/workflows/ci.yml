name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Compile
        run: go build -v ./...

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run tests
        run: go test -v -race ./...

  benchmark:
    name: Benchmark
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -run='^$' ./internal/agents/ ./internal/diff/ | tee benchmark.txt

      - name: Benchmark summary
        run: |
          echo "## Benchmark Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.txt

  coverage:
    name: Coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Generate coverage
        run: |
          go test -coverprofile=coverage.raw ./... 2>&1 | tee coverage-run.txt
          # Exclude test utilities from coverage (they inflate the denominator).
          grep -v '/llmtest/' coverage.raw > coverage.out || cp coverage.raw coverage.out

      - name: Coverage report
        id: coverage
        run: |
          FUNC_REPORT=$(go tool cover -func=coverage.out)
          TOTAL=$(echo "$FUNC_REPORT" | grep total | awk '{print $3}')
          TOTAL_NUM=$(echo "$TOTAL" | tr -d '%')

          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "total_num=$TOTAL_NUM" >> "$GITHUB_OUTPUT"

          # Extract per-package coverage from test output.
          PKG_COVERAGE=$(grep "coverage:" coverage-run.txt | sed 's/ok  	//' | sed 's/\t/ /g' || true)

          # Build per-package table for outputs.
          PKG_TABLE=""
          while IFS= read -r line; do
            pkg=$(echo "$line" | awk '{print $1}')
            cov=$(echo "$line" | grep -o '[0-9.]*% of statements' | head -1)
            if [ -n "$pkg" ] && [ -n "$cov" ]; then
              short_pkg=$(echo "$pkg" | sed 's|github.com/arinorr/prism/||' | sed 's|github.com/arinorr/prism|prism (root)|')
              PKG_TABLE="${PKG_TABLE}| \`${short_pkg}\` | ${cov} |\n"
            fi
          done <<< "$PKG_COVERAGE"
          echo "pkg_table<<DELIM" >> "$GITHUB_OUTPUT"
          echo -e "$PKG_TABLE" >> "$GITHUB_OUTPUT"
          echo "DELIM" >> "$GITHUB_OUTPUT"

          # Step summary
          echo "## Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | Statement Coverage |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|-------------------|" >> "$GITHUB_STEP_SUMMARY"
          echo -e "$PKG_TABLE" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Total** | **${TOTAL}** |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Per-function breakdown</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$FUNC_REPORT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Go only supports statement coverage. Branch/condition coverage is not available in the Go toolchain." >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce 90% coverage threshold
        env:
          TOTAL: ${{ steps.coverage.outputs.total_num }}
        run: |
          THRESHOLD=90
          echo "Coverage: ${TOTAL}% (threshold: ${THRESHOLD}%)"
          if (( $(echo "$TOTAL < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${TOTAL}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          COV_TOTAL: ${{ steps.coverage.outputs.total }}
          COV_PKG_TABLE: ${{ steps.coverage.outputs.pkg_table }}
        with:
          script: |
            const total = process.env.COV_TOTAL;
            const pkgTable = process.env.COV_PKG_TABLE;
            const marker = '<!-- prism-coverage -->';
            const status = parseFloat(total) >= 90 ? '✅ Pass' : '❌ Fail';
            const body = [
              marker,
              '## Coverage Report',
              '',
              '| Package | Statement Coverage |',
              '|---------|-------------------|',
              pkgTable.trim(),
              '| **Total** | **' + total + '** |',
              '',
              '| Threshold | 90% |',
              '| Status | ' + status + ' |',
              '',
              '> Go only supports statement coverage. Branch/condition coverage is not available in the Go toolchain.',
              '',
              '*Updated by CI*',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  format:
    name: Format
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Pinned to avoid moving-target lint failures: `latest` pulls a new
          # release on every CI run, and newer goconst/gocritic defaults can
          # silently break PRs that were green the day before. Bump on purpose.
          version: v2.10.1

  security:
    name: Security
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec ./...
