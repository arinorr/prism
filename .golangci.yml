version: "2"

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - bodyclose
    - durationcheck
    - errchkjson
    - errorlint
    - forcetypeassert
    - goconst
    - gocritic
    - godot
    - misspell
    - predeclared
    - unconvert
    - unparam
    - whitespace

  settings:
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    godot:
      scope: toplevel
    misspell:
      locale: US

  exclusions:
    rules:
      - linters:
          - goconst
        path: _test\.go

output:
  sort-order:
    - file

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
