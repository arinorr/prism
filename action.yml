name: "Shinobi PR Review"
description: "Multi-agent PR review powered by Claude — 7 specialized reviewers analyze your code"
author: "arinorr"

branding:
  icon: "eye"
  color: "purple"

inputs:
  anthropic_api_key:
    description: "Anthropic API key for Claude"
    required: true
  roles:
    description: "Comma-separated list of reviewer roles (default: all)"
    required: false
    default: ""
  format:
    description: "Output format: md, html, json (default: md)"
    required: false
    default: "md"
  comment:
    description: "Post inline suggestions as PR comments (true/false)"
    required: false
    default: "false"

outputs:
  report:
    description: "Path to the generated report file"
    value: ${{ steps.review.outputs.report }}
  findings_count:
    description: "Total number of findings"
    value: ${{ steps.review.outputs.findings_count }}

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.24"

    - name: Install shinobi
      shell: bash
      run: go install github.com/arinorr/shinobi@latest

    - name: Install Claude Code
      shell: bash
      run: npm install -g @anthropic-ai/claude-code

    - name: Run review
      id: review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
      run: |
        PR_NUMBER="${{ github.event.pull_request.number }}"
        FORMAT="${{ inputs.format }}"
        REPORT_FILE="shinobi-review.${FORMAT}"

        ARGS="review ${PR_NUMBER} --format ${FORMAT} --output ${REPORT_FILE}"

        if [ -n "${{ inputs.roles }}" ]; then
          ARGS="${ARGS} --roles ${{ inputs.roles }}"
        fi

        if [ "${{ inputs.comment }}" = "true" ]; then
          ARGS="${ARGS} --comment"
        fi

        shinobi ${ARGS}

        echo "report=${REPORT_FILE}" >> "$GITHUB_OUTPUT"

        # Extract findings count from JSON if available.
        if [ "${FORMAT}" = "json" ]; then
          COUNT=$(jq '.findings | length' "${REPORT_FILE}" 2>/dev/null || echo "0")
        else
          COUNT="n/a"
        fi
        echo "findings_count=${COUNT}" >> "$GITHUB_OUTPUT"

    - name: Upload report artifact
      uses: actions/upload-artifact@v4
      with:
        name: shinobi-review
        path: ${{ steps.review.outputs.report }}

    - name: Post summary to PR
      if: inputs.format == 'md'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -f "${{ steps.review.outputs.report }}" ]; then
          cat "${{ steps.review.outputs.report }}" >> "$GITHUB_STEP_SUMMARY"
        fi
